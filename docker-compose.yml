services:
  # ----------------------------------------------------------------------------
  # Redis - Celery Broker & Result Backend
  # ----------------------------------------------------------------------------
  algoforge-redis:
    container_name: algoforge-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    # Internal communication only (backend and celery reach redis via the internal Docker network on port 6379)
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Backend API - FastAPI Server
  # ----------------------------------------------------------------------------
  algoforge-backend:
    container_name: algoforge-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      algoforge-redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://algoforge-redis:6379/0
      - CELERY_BROKER_URL=redis://algoforge-redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - backend_data:/app/data_storage
      - backend_models:/app/models
      - backend_logs:/app/logs

  # ----------------------------------------------------------------------------
  # Celery Worker - Strategy Discovery & ML / Genetic Engine
  # ----------------------------------------------------------------------------
  algoforge-celery:
    container_name: algoforge-celery
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      algoforge-redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://algoforge-redis:6379/0
      - CELERY_BROKER_URL=redis://algoforge-redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - backend_data:/app/data_storage
      - backend_models:/app/models
      - backend_logs:/app/logs

  # ----------------------------------------------------------------------------
  # Frontend - Vite React SPA served with Nginx
  # ----------------------------------------------------------------------------
  algoforge-frontend:
    container_name: algoforge-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      - algoforge-backend
    # Port 80 on host is used by Dokploy / Traefik / Web server reverse proxy.
    # Default host port mapped to 3000, or route directly via Dokploy Domain / Traefik / Cloudflare.
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    expose:
      - "80"

volumes:
  redis_data:
  backend_data:
  backend_models:
  backend_logs:
